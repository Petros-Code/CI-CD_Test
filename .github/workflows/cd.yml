# Nom du workflow : apparaît dans l'onglet "Actions" de GitHub
name: cd

# --- DÉCLENCHEURS (quand le workflow se lance) ---
on:
    # se lance à chaque push sur la branche main
    push:
        branches: [main]
    # se lance à chaque pull request (ouverte, mise à jour...), peu importe la branche cible
    pull_request:
    # permet de lancer le workflow manuellement depuis l'interface GitHub (bouton "Run workflow")
    workflow_dispatch:

# --- JOBS ---
# un workflow peut contenir plusieurs jobs, exécutés en parallèle par défaut
jobs:
    # ===== JOB 1 : vérification =====
    # ce projet est un site statique (HTML/CSS/JS), donc pas de build Node ici :
    # on se contente de vérifier que les fichiers essentiels sont présents
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            # récupère le code du repo sur la machine virtuelle (indispensable en général)
            - name: Récupérer le code
              uses: actions/checkout@v4

            # vérifie que le point d'entrée du site existe avant d'aller plus loin
            - name: Vérifier que index.html existe
              run: test -f index.html

            # place ici à l'avenir un vrai outil si besoin, ex :
            # - un linter HTML (ex: htmlhint)
            # - des tests end-to-end (ex: Playwright/Cypress)
            - name: Étape de test (placeholder)
              run: echo "Aucun test automatisé pour le moment"

    # ===== JOB 2 : déploiement =====
    deploy:
        # attend que le job "build-and-test" se termine avec succès avant de démarrer
        needs: build-and-test
        # ne déploie que si le push a été fait sur main (évite de déployer depuis une simple pull request)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        runs-on: ubuntu-latest

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            # exemple de déploiement : ici on affiche juste un message,
            # en réalité on utiliserait par exemple actions/deploy-pages pour GitHub Pages,
            # ou une action vers Netlify/Vercel/un serveur FTP/SSH, etc.
            - name: Déployer
              run: echo "Déploiement du site statique en cours..."
